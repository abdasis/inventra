services:
  app:
    image: php:8.4-cli-alpine
    container_name: inventra-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-inventra_db}
      - DB_USERNAME=${DB_USERNAME:-inventra_user}
      - DB_PASSWORD=${DB_PASSWORD:-inventra_secret}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "docker-php-ext-install pdo pdo_mysql &&
             php -S 0.0.0.0:8080 -t apps/web/public"

  db:
    image: mysql:8.4
    container_name: inventra-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-inventra_root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-inventra_db}
      MYSQL_USER: ${DB_USERNAME:-inventra_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-inventra_secret}
    ports:
      - "${DB_PORT:-3309}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./packages/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-inventra_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    name: inventra_db_data
